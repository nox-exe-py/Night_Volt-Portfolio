<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Night Volt ⚡</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
body { margin:0; background:black; overflow-x:hidden; font-family:sans-serif;}
canvas { position:fixed; top:0; z-index:-1;}

.glow { text-shadow:0 0 15px #00ffff,0 0 35px #00ffff;}
.neon-box {
  border:1px solid rgba(0,255,255,0.3);
  background:rgba(0,255,255,0.05);
  backdrop-filter: blur(12px);
  transition:0.4s;
}
.neon-box:hover {
  transform: translateY(-10px) scale(1.05);
  box-shadow:0 0 30px cyan;
}

.btn {
  padding:14px 28px;
  border:1px solid cyan;
  border-radius:999px;
  color:cyan;
  transition:0.3s;
}
.btn:hover {
  background:cyan;
  color:black;
  box-shadow:0 0 25px cyan;
}
</style>
</head>

<body class="text-white">

<!-- HERO -->
<section class="h-screen flex flex-col justify-center items-center text-center">
  <h1 class="text-7xl font-bold glow">Night Volt ⚡</h1>
  <p class="mt-4 text-xl text-gray-300">Elite Discord Bot Developer</p>
  <a href="https://discord.com/users/YOUR_USER_ID" target="_blank" class="mt-6 btn">
    Contact on Discord
  </a>
</section>

<!-- ABOUT -->
<section class="h-screen flex items-center justify-center">
  <div class="max-w-2xl text-center">
    <h2 class="text-4xl glow mb-6">About</h2>
    <p class="text-gray-300 text-lg">
      I build powerful, scalable Discord bots with advanced systems,
      smooth performance, and premium-level architecture.
    </p>
  </div>
</section>

<!-- FEATURES -->
<section class="h-screen flex flex-col items-center justify-center">
  <h2 class="text-4xl glow mb-10">What I Do</h2>
  <div class="grid grid-cols-2 md:grid-cols-4 gap-6 px-6">
    <div class="neon-box p-6 rounded-xl text-center">AIO Bots</div>
    <div class="neon-box p-6 rounded-xl text-center">Music Systems</div>
    <div class="neon-box p-6 rounded-xl text-center">AI Features</div>
    <div class="neon-box p-6 rounded-xl text-center">Automation</div>
  </div>
</section>

<!-- CONTACT BOTTOM -->
<section class="h-screen flex flex-col justify-center items-center">
  <h2 class="text-4xl glow mb-6">Get In Touch</h2>
  <a href="https://discord.com/users/YOUR_USER_ID" target="_blank" class="btn text-lg">
    night._volt
  </a>
</section>

<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({alpha:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const geometry = new THREE.BufferGeometry();
const vertices = [];
for (let i = 0; i < 10000; i++) {
  vertices.push((Math.random()-0.5)*1000,(Math.random()-0.5)*1000,(Math.random()-0.5)*1000);
}
geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices,3));

const material = new THREE.PointsMaterial({color:0x00ffff,size:1});
const stars = new THREE.Points(geometry,material);
scene.add(stars);

camera.position.z = 5;

function animate(){
  requestAnimationFrame(animate);
  stars.rotation.y += 0.0008;
  stars.rotation.x += 0.0004;
  renderer.render(scene,camera);
}
animate();
</script>

<script>
gsap.registerPlugin(ScrollTrigger);
gsap.utils.toArray("section").forEach(sec=>{
  gsap.from(sec,{
    opacity:0,
    y:100,
    duration:1,
    scrollTrigger:{ trigger:sec, start:"top 80%" }
  });
});
</script>

</body>
</html>
